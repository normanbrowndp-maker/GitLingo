  <main>
    <section aria-labelledby="pet-title">
      <h1 id="pet-title">Твой питомец</h1>
      <div class="pet-current card">
        <p class="pet-current__emoji" aria-label="Яйцо" data-current-pet><svg class="pet-art" viewBox="0 0 160 160" aria-hidden="true" focusable="false"><use href="#pet-egg"></use><use class="pet-art__crack" href="#pet-egg-crack"></use></svg></p>
        <h2>Яйцо</h2>
        <progress id="pet-xp-progress" value="0" max="100">0 из 100 XP</progress>
        <p>0 из 100 XP до следующего уровня</p>
      </div>
    </section>

    <section aria-labelledby="pet-levels-title">
      <h2 id="pet-levels-title">Уровни питомца</h2>
      <ol class="pet-levels">
        <li data-level="1">
          <h3>Яйцо <svg class="pet-art" viewBox="0 0 160 160" aria-hidden="true" focusable="false"><use href="#pet-egg"></use></svg></h3>
          <p>Требуется XP: <span>0</span></p>
        </li>
        <li data-level="2">
          <h3>Акулёнок <svg class="pet-art" viewBox="0 0 160 160" aria-hidden="true" focusable="false"><use href="#pet-pup"></use></svg></h3>
          <svg class="pet-level__lock icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-lock"></use></svg>
          <p>Требуется XP: <span>100</span></p>
        </li>
        <li data-level="3">
          <h3>Акула <svg class="pet-art" viewBox="0 0 160 160" aria-hidden="true" focusable="false"><use href="#pet-shark"></use></svg></h3>
          <svg class="pet-level__lock icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-lock"></use></svg>
          <p>Требуется XP: <span>300</span></p>
        </li>
        <li data-level="4">
          <h3>Мегаладон <svg class="pet-art" viewBox="0 0 160 160" aria-hidden="true" focusable="false"><use href="#pet-megalodon"></use></svg></h3>
          <svg class="pet-level__lock icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-lock"></use></svg>
          <p>Требуется XP: <span>700</span></p>
        </li>
      </ol>
    </section>
