<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта обучения — GitLingo</title>
  <meta name="application-name" content="GitLingo">
  <script>
    try {
      const storedTheme = localStorage.getItem("mega-theme");
      const savedTheme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : null;
      document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch {
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/storage.js" defer></script>
  <script src="js/data/lessons.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/learn.js" defer></script>
</head>
<body class="page-learn">
  <header class="site-header">
    <a class="site-header__logo" href="index.html" data-home-link><span>Git</span><span class="site-header__accent">Lingo</span></a>
    <nav class="site-header__nav" aria-label="Основная навигация">
      <a href="learn.html" data-nav-link>Учиться</a>
      <a href="pet.html" data-nav-link>Питомец</a>
    </nav>
    <div class="site-header__status">
      <span class="site-header__streak" id="streak-count">🔥 0</span>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Включить тёмную тему" aria-pressed="false">
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.1 15.7A8.5 8.5 0 0 1 8.3 3.9 8.6 8.6 0 1 0 20.1 15.7Z" /></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
        <span class="visually-hidden">Переключить тему</span>
      </button>
    </div>
  </header>

  <main>
    <section class="learn-section" aria-labelledby="learn-title">
      <h1 id="learn-title">Выбери урок</h1>
      <ul class="lesson-list" id="lesson-list">
        <li><a class="lesson-node" href="lesson.html?id=1" data-status="open">Урок 1: Основы терминала</a></li>
        <li><a class="lesson-node" href="lesson.html?id=2" data-status="locked">Урок 2: Файлы и папки</a></li>
        <li><a class="lesson-node" href="lesson.html?id=3" data-status="locked">Урок 3: Команды терминала</a></li>
        <li><a class="lesson-node" href="lesson.html?id=4" data-status="locked">Урок 4: Горячие клавиши</a></li>
        <li><a class="lesson-node" href="lesson.html?id=5" data-status="locked">Урок 5: Работа с кодом</a></li>
      </ul>
    </section>

    <section class="bonus-section" aria-labelledby="bonus-title">
      <h2 id="bonus-title">Бонусы</h2>
      <ul class="bonus-grid" id="bonus-list">
        <li class="bonus-card"><a href="lesson.html?id=6" data-bonus="figma">Знакомство с Figma</a></li>
        <li class="bonus-card"><a href="lesson.html?id=7" data-bonus="vscode">Знакомство с VS Code</a></li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <button type="button" id="reset-progress" class="btn btn--secondary" data-reset-progress>Сбросить прогресс</button>
    <p>GitLingo</p>
  </footer>
</body>
</html>
