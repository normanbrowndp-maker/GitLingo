<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Итоги урока — GitLingo</title>
  <meta name="application-name" content="GitLingo">
  <script>
    try {
      const storedTheme = localStorage.getItem("mega-theme");
      const savedTheme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : null;
      document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch {
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/storage.js" defer></script>
  <script src="js/data/lessons.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/results.js" defer></script>
</head>
<body class="page-results">
  <header class="site-header">
    <a class="site-header__logo" href="index.html" data-home-link><span>Git</span><span class="site-header__accent">Lingo</span></a>
    <nav class="site-header__nav" aria-label="Основная навигация">
      <a href="learn.html" data-nav-link>Учиться</a>
      <a href="pet.html" data-nav-link>Питомец</a>
    </nav>
    <div class="site-header__status">
      <span class="site-header__streak" id="streak-count">🔥 0</span>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Включить тёмную тему" aria-pressed="false">
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.1 15.7A8.5 8.5 0 0 1 8.3 3.9 8.6 8.6 0 1 0 20.1 15.7Z" /></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
        <span class="visually-hidden">Переключить тему</span>
      </button>
    </div>
  </header>

  <main>
    <section aria-labelledby="results-title">
      <h1 id="results-title">Урок пройден!</h1>
      <p id="results-hint" hidden></p>
      <dl class="results-stats">
        <div class="stat-card">
          <dt>Очки</dt>
          <dd id="stat-score">0</dd>
        </div>
        <div class="stat-card">
          <dt>Точность</dt>
          <dd id="stat-accuracy">0%</dd>
        </div>
        <div class="stat-card">
          <dt>Время</dt>
          <dd id="stat-time">0 минут</dd>
        </div>
        <div class="stat-card">
          <dt>Заработанные XP</dt>
          <dd id="stat-xp">0 XP</dd>
        </div>
      </dl>
    </section>

    <section aria-labelledby="results-streak-title">
      <h2 id="results-streak-title">Серия</h2>
      <p id="results-streak">🔥 0 дней</p>
    </section>

    <nav aria-label="Действия после урока">
      <a class="btn btn--primary" href="lesson.html?id=2" id="next-lesson-link">Следующий урок</a>
      <a class="btn btn--secondary" href="lesson.html?id=1&amp;mode=test" id="retake-test-link" hidden>Пересдать тест</a>
      <a class="btn btn--secondary" href="lesson.html?id=1" id="retry-lesson-link" hidden>Повторить урок</a>
      <a class="btn btn--secondary" href="learn.html" id="learn-map-link">К карте уроков</a>
      <p id="all-lessons-complete" hidden>Ты прошёл все уроки!</p>
    </nav>
  </main>

  <footer class="site-footer">
    <p>GitLingo</p>
  </footer>
</body>
</html>
